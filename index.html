<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes App</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f5f5fa;
      }

      .page-container {
        display: flex;
        min-height: 100vh;
      }

      /* Sidebar */
      .nav-container {
        width: 240px;
        flex-shrink: 0;
        background: #dedede;
        padding: 20px 12px;
      }

      .header {
        font-size: 20px;
        margin-bottom: 30px;
      }

      .header i,
      .nav-sidebar i {
        color: #b197fc;
      }

      .nav-sidebar {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .nav-sidebar a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        color: black;
        text-decoration: none;
        border-radius: 8px;
        cursor: pointer;
      }

      .nav-sidebar a:hover,
      .nav-sidebar a.active {
        background: white;
      }

      /* Main content */
      .main-content {
        flex: 1;
        min-width: 0;
        padding: 25px;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 25px;
      }

      .top-bar h1 {
        font-size: 28px;
      }

      button {
        cursor: pointer;
      }

      .add-button {
        background: #b197fc;
        border: none;
        padding: 12px 18px;
        border-radius: 8px;
        font-size: 15px;
      }

      .add-button:hover {
        background: #9a7aef;
      }

      /* Notes */
      .notes-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 18px;
      }

      .note-card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 2px 8px #00000012;
        overflow-wrap: anywhere;
      }

      .note-card h3 {
        margin-bottom: 12px;
      }

      .note-card p {
        margin-bottom: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .note-info {
        font-size: 13px;
        color: #666;
      }

      .delete-button {
        background: #ffe2e2;
        color: #c62828;
        border: none;
        padding: 9px 12px;
        border-radius: 6px;
        margin-top: 5px;
      }

      .edit-button {
        background: #e2f0ff;
        color: #1565c0; 
        border: none;
        padding: 9px 12px;
        border-radius: 6px;
        margin-top: 5px;
      }
     
      .empty-message {
        text-align: center;
        color: #777;
        margin-top: 35px;
      }

      /* Form popup */
      .form-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        justify-content: center;
        align-items: center;
        padding: 20px;
        z-index: 10;
      }

      .form-overlay.show {
        display: flex;
      }

      .form-container {
        width: 100%;
        max-width: 500px;
        max-height: 90vh;
        overflow-y: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
      }

      .form-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
      }

      .form-header h2 {
        font-size: 24px;
      }

      .close-button {
        border: none;
        background: transparent;
        font-size: 27px;
        color: red;
      }

      .field {
        margin-bottom: 18px;
      }

      .field > label,
      .field > p {
        display: block;
        font-weight: bold;
        margin-bottom: 9px;
      }

      .field input[type="text"],
      .field textarea,
      .field select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
      }

      .field textarea {
        min-height: 110px;
        resize: vertical;
      }

      .priority-options {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
      }

      .priority-options label {
        cursor: pointer;
      }

      .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 25px;
      }

      .form-actions button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 7px;
        font-size: 15px;
      }

      .submit-button {
        background: #b197fc;
      }

      .reset-button {
        background: #e5e5e5;
      }

      @media (max-width: 650px) {
        .page-container {
          flex-direction: column;
        }

        .nav-container {
          width: 100%;
        }

        .nav-sidebar {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .main-content {
          padding: 18px;
        }
      }
    </style>
  </head>

  <body>
    <div class="page-container">
      <!-- Sidebar -->
      <aside class="nav-container">
        <div class="header">
          <h2>
            <i class="fa-regular fa-clipboard"></i>
            NOTES
          </h2>
        </div>

        <nav class="nav-sidebar">
          <a href="#" class="active" id="allNotesLink">
            <i class="fa-solid fa-note-sticky"></i>
            All Notes
          </a>

          <a href="#" id="newNotesLink">
            <i class="fa-solid fa-square-plus"></i>
            New Notes
          </a>

          <a href="#" id="favoritesLink">
            <i class="fa-solid fa-heart"></i>
            Favorites
          </a>

          <a href="#" id="categoryLink">
            <i class="fa-solid fa-folder"></i>
            Category
          </a>

          <a href="#" id="searchLink">
            <i class="fa-solid fa-magnifying-glass"></i>
            Search
          </a>

          <a href="#" id="trashLink">
            <i class="fa-solid fa-trash"></i>
            Trash
          </a>
        </nav>
      </aside>

      <!-- Main content -->
      <main class="main-content" id="notesContainer">
        <div class="top-bar">
          <h1 id="pageTitle">All Notes</h1>

          <button class="add-button" id="openForm">
            <i class="fa-solid fa-plus"></i>
            Add Note
          </button>
        </div>

        <div id="notesList" class="notes-list"></div>

        <p id="emptyMessage" class="empty-message">
          No notes yet. Click Add Note to create one.
        </p>
      </main>
    </div>

    <div class="form-overlay" id="formOverlay">
      <div class="form-container">
        <div class="form-header">
          <h2>Create Note</h2>

          <button
            type="button"
            class="close-button"
            id="closeBtn"
            aria-label="Close form"
          >
            <i class="fa-solid fa-circle-xmark"></i>
          </button>
        </div>

        <form id="newnotes">
          <div class="field">
            <label for="noteId">Note ID</label>
            <input
              type="text"
              id="noteId"
              maxlength="5"
              placeholder="Enter your ID"
              required
            />
          </div>

          <div class="field">
            <label for="title">Title</label>
            <input
              type="text"
              id="title"
              placeholder="Enter Your Title"
              required
            />
          </div>

          <div class="field">
            <label for="description">Description</label>
            <textarea
              id="description"
              placeholder="Enter description"
              required
            ></textarea>
          </div>

          <div class="field">
            <p>Priority</p>

            <div class="priority-options">
              <label>
                <input type="radio" name="priority" value="High" required />
                High
              </label>

              <label>
                <input type="radio" name="priority" value="Medium" />
                Medium
              </label>

              <label>
                <input type="radio" name="priority" value="Low" />
                Low
              </label>
            </div>
          </div>

          <div class="field">
            <label for="category">Category</label>

            <select id="category" required>
              <option value="">Select Category</option>
              <option value="Work">Work</option>
              <option value="Study">Study</option>
              <option value="Personal">Personal</option>
            </select>
          </div>

          <div class="form-actions">
            <button type="submit" class="submit-button">Create Note</button>

            <button type="reset" class="reset-button">Clear Form</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      let notes = JSON.parse(localStorage.getItem("notes")) || [];

      const form = document.getElementById("newnotes");
      const notesList = document.getElementById("notesList");
      const formOverlay = document.getElementById("formOverlay");
      const emptyMessage = document.getElementById("emptyMessage");

      document
        .getElementById("openForm")
        .addEventListener("click", function () {
          formOverlay.style.display = "flex";
        });

      document
        .getElementById("closeBtn")
        .addEventListener("click", function () {
          formOverlay.style.display = "none";
        });

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        let noteId = document.getElementById("noteId").value;
        let title = document.getElementById("title").value;
        let description = document.getElementById("description").value;

        let priority = document.querySelector(
          'input[name="priority"]:checked',
        ).value;

        let category = document.getElementById("category").value;

        notes.push({
          id: noteId,
          title: title,
          description: description,
          priority: priority,
          category: category,
        });

        localStorage.setItem("notes", JSON.stringify(notes));

        form.reset();
        formOverlay.style.display = "none";

        showNotes();
      });

      function editNote(index) {
        const note = notes[index];

        document.getElementById("noteId").value = note.id;
        document.getElementById("title").value = note.title;
        document.getElementById("description").value = note.description;

        document.querySelector(
          `input[name="priority"][value="${note.priority}"]`,
        ).checked = true;

        document.getElementById("category").value = note.category;

        formOverlay.style.display = "flex";

        notes.splice(index, 1);

        localStorage.setItem("notes", JSON.stringify(notes));
      }

      function showNotes() {
        notesList.innerHTML = "";

        if (notes.length === 0) {
          emptyMessage.style.display = "block";
        } else {
          emptyMessage.style.display = "none";
        }

        notes.forEach(function (note, index) {
          notesList.innerHTML += `
            <div class="note-card">
              <h3>${note.title}</h3>

              <p>${note.description}</p>

              <p>Priority: ${note.priority}</p>

              <p>Category: ${note.category}</p>

              <button
                class="delete-button"
                onclick="deleteNote(${index})"
              >
                Delete
              </button>

              <button class="edit-button" onclick="editNote(${index})">
                Edit
              </button>
            </div>
          `;
        });
      }

      function deleteNote(del) {
        notes.splice(del, 1);

        localStorage.setItem("notes", JSON.stringify(notes));

        showNotes();
      }

      showNotes();
    </script>
  </body>
</html>
